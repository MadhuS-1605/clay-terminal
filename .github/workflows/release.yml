name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release (e.g. v0.6.1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/${{ inputs.tag }}" > /dev/null; then
            echo "Tag ${{ inputs.tag }} already exists on origin, skipping (retry of a partially failed release)."
          else
            git tag "${{ inputs.tag }}"
            git push origin "${{ inputs.tag }}"
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publish to VS Code Marketplace
        run: npx @vscode/vsce publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish to Open VSX
        if: always()
        run: |
          set +e
          output=$(npx ovsx publish 2>&1)
          status=$?
          echo "$output"
          if [ $status -ne 0 ] && echo "$output" | grep -qi "already"; then
            echo "Version already published to Open VSX, treating as success (retry of a partially failed release)."
            exit 0
          fi
          exit $status
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
