"$schema" = "https://starship.rs/config-schema.json"

# Clay Terminal Starship preset -- coral accent (#D97757), warm-gray neutrals
# (#C3C2B7), generated by icons/generate_starship.py from icons/palette.py.
# Install: copy to ~/.config/starship.toml (or merge with your existing config).

format = """
$directory\
$git_branch\
$git_status\
$character"""

[character]
success_symbol = "[❯](bold #D97757)"
error_symbol = "[❯](bold #D97757)"
vimcmd_symbol = "[❮](bold #D97757)"

[directory]
style = "bold #C3C2B7"
truncation_length = 3
truncate_to_repo = true

[git_branch]
style = "#D97757"
symbol = " "

[git_status]
style = "bold #D97757"

[cmd_duration]
style = "#C3C2B7"
format = "took [$duration]($style) "
